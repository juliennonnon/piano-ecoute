<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Écoute</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Plan : une scène sombre « salle de concert » plein écran, scène canvas au centre, menu de niveaux en grille */
:root{
  --bg:#12101f; --panel:#1d1a33; --line:#2f2a52; --fg:#f2efff; --muted:#a39dc9;
  --accent:#ffb547; --ok:#5ee6a8; --bad:#ff6b8a; --note:#7c8cff;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.6rem;margin:0;letter-spacing:.5px}
h1 span{color:var(--accent)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#2a1a00;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--fg)}
#menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.lvl{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;min-height:104px}
.lvl small{color:var(--muted);font-weight:700}
.lvl .num{font-family:var(--display);color:var(--accent);font-size:.9rem;letter-spacing:1px;text-transform:uppercase}
.lvl .stars{color:var(--accent);letter-spacing:2px}
.lvl.locked{opacity:.45}
#game{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
#stage{flex:1;min-height:300px;position:relative;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
#heard b{color:var(--ok)}
.mic{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:700}
.meter{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,16,31,.82);text-align:center;padding:20px}
#overlay div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px}
#overlay h2{font-family:var(--display);margin:0;font-size:1.8rem}
#overlay p{margin:0;color:var(--muted)}
.big{font-size:2rem;color:var(--accent);letter-spacing:4px}
.note{color:var(--muted);font-size:.85rem}
input[type=range]{accent-color:var(--accent);width:90px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Piano <span>Écoute</span></h1>
    <div class="row">
      <div class="seg" role="group" aria-label="Affichage">
        <button id="mFall" aria-pressed="true">Notes qui tombent</button>
        <button id="mStaff" aria-pressed="false">Partition</button>
      </div>
      <div class="seg" role="group" aria-label="Noms des notes">
        <button id="nFr" aria-pressed="true">Do Ré Mi</button>
        <button id="nEn" aria-pressed="false">C D E</button>
      </div>
    </div>
  </header>

  <section id="menuView">
    <p class="note" style="margin:0 0 12px">Choisis un niveau. Le morceau attend que tu joues la bonne note, au piano (micro) ou en touchant le clavier à l'écran.</p>
    <div id="menu"></div>
  </section>

  <section id="game" hidden>
    <div class="hud">
      <div class="row">
        <button id="back">← Niveaux</button>
        <span class="pill" id="title">–</span>
        <span class="pill" id="prog">0 / 0</span>
      </div>
      <div class="row">
        <span class="pill" id="heard">Entendu : –</span>
        <label class="mic">Micro <span class="meter"><i id="lvl"></i></span></label>
        <label class="mic">Sensibilité <input id="sens" type="range" min="1" max="10" value="8"></label>
        <label class="mic"><input id="anti" type="checkbox" checked> Anti-bruit</label>
        <button id="demo">▶ Écouter</button>
      </div>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="overlay"><div id="ovBox"></div></div>
    </div>
  </section>
</div>

<script>
const FR=['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const EN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const COLORS=['#ff6b6b','#ff6b6b','#ffa94d','#ffa94d','#ffd43b','#69db7c','#69db7c','#38d9a9','#38d9a9','#4dabf7','#4dabf7','#b197fc'];
let names=FR, mode='fall';
const nm=m=>names[m%12];

const LEVELS=[
 {t:'Le Do',d:'Trouve le Do, juste à gauche des 2 touches noires',n:[60,60,60,60]},
 {t:'Do et Ré',d:'Deux voisins',n:[60,62,60,62,62,60,62,60]},
 {t:'Do Ré Mi',d:'Trois doigts : pouce, index, majeur',n:[60,62,64,62,60,64,62,60]},
 {t:'Fa et Sol',d:'La main entière : 5 notes',n:[60,62,64,65,67,65,64,62,60]},
 {t:'Gamme qui monte',d:'De Do à Do',n:[60,62,64,65,67,69,71,72]},
 {t:'Gamme qui descend',d:'Et on redescend',n:[72,71,69,67,65,64,62,60]},
 {t:'Au clair de la lune',d:'Première chanson',n:[60,60,60,62,64,62,60,64,62,62,60]},
 {t:'Frère Jacques',d:'Le grand classique',n:[60,62,64,60,60,62,64,60,64,65,67,64,65,67]},
 {t:'Ode à la joie',d:'Beethoven, version facile',n:[64,64,65,67,67,65,64,62,60,60,62,64,64,62,62]},
 {t:'Les sauts',d:'Do, Mi, Sol : sauter des touches',n:[60,64,67,64,60,67,72,67,60]},
];

// --- sauvegarde
let save={};
try{save=JSON.parse(localStorage.getItem('pianoEcoute')||'{}')}catch(e){}
const store=()=>{try{localStorage.setItem('pianoEcoute',JSON.stringify(save))}catch(e){}};

function buildMenu(){
  const m=document.getElementById('menu');m.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const unlocked=i===0||save[i-1]!=null;
    const b=document.createElement('button');
    b.className='lvl'+(unlocked?'':' locked');
    const s=save[i]!=null?'★'.repeat(save[i])+'☆'.repeat(3-save[i]):'☆☆☆';
    b.innerHTML=`<span class="num">Niveau ${i+1}</span><strong>${L.t}</strong><small>${unlocked?L.d:'Termine le niveau précédent'}</small><span class="stars">${s}</span>`;
    if(unlocked)b.onclick=()=>start(i);
    m.appendChild(b);
  });
}

// --- audio
let ac,analyser,buf,micOn=false;
function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac}
function tone(m,dur=.6,when=0){
  const a=ctx(),t=a.currentTime+when,f=440*Math.pow(2,(m-69)/12);
  [1,2].forEach((h,k)=>{const o=a.createOscillator(),g=a.createGain();o.type=k?'sine':'triangle';o.frequency.value=f*h;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(k?.05:.25,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)});
}
async function startMic(){
  if(micOn)return true;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ctx();analyser=a.createAnalyser();analyser.fftSize=2048;buf=new Float32Array(analyser.fftSize);
    const gn=a.createGain();gn.gain.value=4;a.createMediaStreamSource(s).connect(gn).connect(analyser);micOn=true;return true;
  }catch(e){return false}
}
// autocorrélation
function detect(){
  analyser.getFloatTimeDomainData(buf);
  let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);
  const thr=0.03*Math.pow(0.62,+document.getElementById('sens').value);
  document.getElementById('lvl').style.width=Math.min(100,rms*2500)+'%';
  if(rms<thr)return{rms,midi:null};
  const N=buf.length,sr=ac.sampleRate,minL=Math.floor(sr/1100),maxL=Math.floor(sr/70);
  let best=-1,bl=0,c=new Float32Array(maxL+2);
  for(let l=minL;l<=maxL+1;l++){let s=0;for(let i=0;i<N-l;i++)s+=buf[i]*buf[i+l];c[l]=s}
  let e0=0;for(let i=0;i<N;i++)e0+=buf[i]*buf[i];
  for(let l=minL+1;l<=maxL;l++){if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>best){best=c[l];bl=l}}
  // premier pic suffisamment haut (évite les erreurs d'octave)
  for(let l=minL+1;l<=maxL;l++){if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>best*0.9){bl=l;break}}
  if(!bl||best/e0<0.2)return{rms,midi:null};
  const a=c[bl-1],b=c[bl],d=c[bl+1],sh=(a-d)/(2*(a-2*b+d))||0;
  const f=sr/(bl+sh);const mf=69+12*Math.log2(f/440);return{rms,midi:Math.round(mf),mf};
}

// --- jeu
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let L=null,li=0,idx=0,scroll=0,miss=0,done=false,flash=0,flashBad=0,pressed=null,pressT=0;
let stable={m:null,k:0},armed=true,peak=0,prevR=0,lastMiss=null;
const LO=60,HI=76;
const isBlack=m=>[1,3,6,8,10].includes(m%12);

function start(i){
  li=i;L=LEVELS[i];idx=0;scroll=0;miss=0;done=false;
  document.getElementById('menuView').hidden=true;document.getElementById('game').hidden=false;
  document.getElementById('title').textContent=`${i+1}. ${L.t}`;
  updProg();resize();
  showOverlay(`<h2>${L.t}</h2><p>${L.d}</p><p>Joue chaque note quand elle arrive sur la ligne. Le morceau t'attend.</p>
   <button class="primary" id="go">🎤 Jouer avec le micro</button><button id="noMic">Sans micro (clavier à l'écran)</button>`);
  document.getElementById('go').onclick=async()=>{const ok=await startMic();hideOverlay();
    if(!ok)document.getElementById('heard').innerHTML='Micro refusé : touche le clavier à l\'écran'};
  document.getElementById('noMic').onclick=()=>{ctx();hideOverlay()};
}
function updProg(){document.getElementById('prog').textContent=`${Math.min(idx,L.n.length)} / ${L.n.length}`}
function showOverlay(h){document.getElementById('ovBox').innerHTML=h;document.getElementById('overlay').hidden=false}
function hideOverlay(){document.getElementById('overlay').hidden=true}

function play(m,fromScreen){
  if(done||!document.getElementById('overlay').hidden)return;
  const target=L.n[idx];
  if(m%12===target%12){ // même nom de note, toutes octaves
    idx++;flash=1;updProg();
    if(idx>=L.n.length)finish();
  }else{
    if(lastMiss!==m){miss++;flashBad=1;lastMiss=m}
  }
}
function finish(){
  done=true;const stars=miss===0?3:miss<=3?2:1;
  save[li]=Math.max(save[li]||0,stars);store();buildMenu();
  setTimeout(()=>showOverlay(`<h2>Bravo !</h2><div class="big">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
   <p>${miss===0?'Aucune erreur, parfait.':miss+' fausse'+(miss>1?'s':'')+' note'+(miss>1?'s':'')+'.'}</p>
   <div class="row" style="justify-content:center"><button id="again">Rejouer</button>${li<LEVELS.length-1?'<button class="primary" id="next">Niveau suivant →</button>':''}</div>`),400);
  setTimeout(()=>{const a=document.getElementById('again');if(a)a.onclick=()=>start(li);const n=document.getElementById('next');if(n)n.onclick=()=>start(li+1)},420);
}

// Filtre piano : un piano a une attaque franche (le volume bondit d'un coup)
// et une hauteur parfaitement stable. Une voix monte plus doucement et glisse.
let hist=[],noise=0.002,onsetAt=-99,frameN=0;
function micTick(){
  if(!micOn||!L)return;
  frameN++;
  const {rms,midi,mf}=detect();
  const strict=document.getElementById('anti').checked;
  const minRecent=hist.length?Math.min(...hist.slice(-6).map(h=>h.rms)):rms;
  // bruit de fond adaptatif : les sons lointains restent sous le seuil
  if(frameN-onsetAt>30)noise=noise*0.98+Math.min(rms,noise*3)*0.02;
  const onset=rms>minRecent*(strict?2.2:1.6)&&rms>noise*(strict?3:2);
  if(onset){onsetAt=frameN}
  if(!strict&&!armed){peak=Math.max(peak,rms);if(rms<peak*0.45)armed=true}
  hist.push({rms,mf});if(hist.length>12)hist.shift();
  if(midi==null||rms<noise*(strict?2.5:1.5)){stable={m:null,k:0};document.getElementById('heard').innerHTML='Entendu : –';lastMiss=null;return}
  document.getElementById('heard').innerHTML=`Entendu : <b>${nm(midi)}</b>`;
  if(stable.m===midi)stable.k++;else stable={m:midi,k:1};
  if(stable.k<3)return;
  if(strict){
    // hauteur stable à ±15 cents sur 3 mesures, et attaque récente
    const last=hist.slice(-3).map(h=>h.mf).filter(x=>x!=null);
    const spread=Math.max(...last)-Math.min(...last);
    if(last.length<3||spread>0.15)return;
    if(frameN-onsetAt>10||onsetAt<0)return;
    onsetAt=-99;play(midi);
  }else if(stable.k===3&&armed){armed=false;peak=rms;play(midi)}
}

// --- dessin
let W=0,H=0,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);

function keyLayout(){
  const whites=[];for(let m=LO;m<=HI;m++)if(!isBlack(m))whites.push(m);
  const kw=W/whites.length,kh=Math.min(150,H*.32),y=H-kh,keys=[];
  whites.forEach((m,i)=>keys.push({m,x:i*kw,w:kw,h:kh,y,black:false}));
  for(let m=LO;m<=HI;m++)if(isBlack(m)){const wi=whites.indexOf(m-1);keys.push({m,x:(wi+1)*kw-kw*.3,w:kw*.6,h:kh*.6,y,black:true})}
  return {keys,kw,kh,y};
}
function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}

function drawKeys(K,target){
  const order=[...K.keys.filter(k=>!k.black),...K.keys.filter(k=>k.black)];
  for(const k of order){
    const isT=target!=null&&k.m===target, isP=pressed===k.m&&performance.now()-pressT<200;
    g.fillStyle=k.black?(isT?COLORS[k.m%12]:'#1a1726'):(isT?COLORS[k.m%12]:isP?'#dcd8f5':'#f7f5ff');
    rr(k.x+1,k.y,k.w-2,k.h,6);g.fill();
    if(!k.black){g.fillStyle=isT?'#1a1033':'#8a84b0';g.font=`700 ${Math.max(10,K.kw*.26)}px Nunito`;g.textAlign='center';g.fillText(nm(k.m),k.x+k.w/2,k.y+k.h-10)}
  }
}

function drawFall(K){
  const lineY=K.y-6,sp=Math.max(70,H*.18);
  g.strokeStyle='rgba(255,181,71,.7)';g.lineWidth=3;g.beginPath();g.moveTo(0,lineY);g.lineTo(W,lineY);g.stroke();
  // repères verticaux
  g.strokeStyle='rgba(255,255,255,.04)';g.lineWidth=1;
  K.keys.filter(k=>!k.black).forEach(k=>{g.beginPath();g.moveTo(k.x,0);g.lineTo(k.x,K.y);g.stroke()});
  L.n.forEach((m,i)=>{
    if(i<idx-1)return;
    const k=K.keys.find(k=>k.m===m);const nh=sp*.7;
    const yb=lineY-(i-scroll)*sp;const y=yb-nh;
    if(y>H||yb<-10)return;
    const cur=i===idx;
    g.globalAlpha=i<idx?Math.max(0,1-(scroll-i+1)):1;
    g.fillStyle=COLORS[m%12];
    if(cur){g.shadowColor=COLORS[m%12];g.shadowBlur=20+10*Math.sin(performance.now()/200)}
    rr(k.x+4,y,k.w-8,nh,10);g.fill();g.shadowBlur=0;
    g.fillStyle='#1a1033';g.font=`800 ${Math.min(18,k.w*.32)}px Nunito`;g.textAlign='center';g.fillText(nm(m),k.x+k.w/2,yb-10);
    g.globalAlpha=1;
  });
}

function drawStaff(K){
  const top=H*.1,gap=Math.min(18,(K.y-top)/9),bottom=top+gap*4+gap*2.5; // ligne du bas = Mi4
  const base=top+gap*4+gap*1.5, cx=W*.28, sp=Math.max(64,W*.12);
  g.strokeStyle='#cfc9ef';g.lineWidth=1.4;
  for(let i=0;i<5;i++){const y=base-i*gap;g.beginPath();g.moveTo(10,y);g.lineTo(W-10,y);g.stroke()}
  g.fillStyle='#cfc9ef';g.font=`${gap*6.2}px serif`;g.textAlign='left';g.fillText('𝄞',14,base+gap*1.2);
  // curseur
  g.fillStyle='rgba(255,181,71,.15)';g.fillRect(cx-sp*.35,base-gap*6,sp*.7,gap*9);
  g.strokeStyle='rgba(255,181,71,.8)';g.lineWidth=2;g.beginPath();g.moveTo(cx,base-gap*6);g.lineTo(cx,base+gap*3);g.stroke();
  const dia=m=>[0,0,1,1,2,3,3,4,4,5,5,6][m%12]+7*Math.floor(m/12);
  L.n.forEach((m,i)=>{
    const x=cx+(i-scroll)*sp;if(x<40||x>W+20)return;
    const d=dia(m)-dia(64), y=base-d*gap/2, cur=i===idx;
    if(d<=-2){g.strokeStyle='#cfc9ef';g.lineWidth=1.4;for(let s=-2;s>=d;s-=2){const ly=base-s*gap/2;g.beginPath();g.moveTo(x-gap*1.1,ly);g.lineTo(x+gap*1.1,ly);g.stroke()}}
    if(d>=10){g.strokeStyle='#cfc9ef';for(let s=10;s<=d;s+=2){const ly=base-s*gap/2;g.beginPath();g.moveTo(x-gap*1.1,ly);g.lineTo(x+gap*1.1,ly);g.stroke()}}
    g.fillStyle=i<idx?'#5ee6a8':cur?COLORS[m%12]:'#f2efff';
    if(cur){g.shadowColor=COLORS[m%12];g.shadowBlur=18}
    g.save();g.translate(x,y);g.rotate(-.35);g.beginPath();g.ellipse(0,0,gap*.68,gap*.48,0,0,7);g.fill();g.restore();g.shadowBlur=0;
    g.strokeStyle=g.fillStyle;g.lineWidth=1.6;g.beginPath();
    if(d<4){g.moveTo(x+gap*.6,y);g.lineTo(x+gap*.6,y-gap*3.2)}else{g.moveTo(x-gap*.6,y);g.lineTo(x-gap*.6,y+gap*3.2)}g.stroke();
    g.fillStyle=cur?'#ffb547':'#a39dc9';g.font=`800 13px Nunito`;g.textAlign='center';g.fillText(nm(m),x,base+gap*4.2);
  });
}

function frame(){
  requestAnimationFrame(frame);
  if(!L||document.getElementById('game').hidden)return;
  micTick();
  scroll+=(idx-scroll)*0.12;
  g.clearRect(0,0,W,H);
  const K=keyLayout();
  if(mode==='fall')drawFall(K);else drawStaff(K);
  drawKeys(K,done?null:L.n[idx]);
  if(flash>0){g.fillStyle=`rgba(94,230,168,${flash*.18})`;g.fillRect(0,0,W,H);flash-=.05}
  if(flashBad>0){g.fillStyle=`rgba(255,107,138,${flashBad*.2})`;g.fillRect(0,0,W,H);flashBad-=.05}
}
requestAnimationFrame(frame);

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,K=keyLayout();
  const hit=[...K.keys.filter(k=>k.black),...K.keys.filter(k=>!k.black)].find(k=>x>=k.x&&x<k.x+k.w&&y>=k.y&&y<k.y+k.h);
  if(hit){pressed=hit.m;pressT=performance.now();tone(hit.m);lastMiss=null;play(hit.m,true)}
});

document.getElementById('back').onclick=()=>{L=null;document.getElementById('game').hidden=true;document.getElementById('menuView').hidden=false};
document.getElementById('demo').onclick=()=>{if(!L)return;L.n.forEach((m,i)=>tone(m,.5,i*.45))};
const seg=(a,b,fn)=>{a.onclick=()=>{a.setAttribute('aria-pressed','true');b.setAttribute('aria-pressed','false');fn(0)};b.onclick=()=>{b.setAttribute('aria-pressed','true');a.setAttribute('aria-pressed','false');fn(1)}};
seg(mFall,mStaff,v=>mode=v?'staff':'fall');
